<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>
  <rect x="16" y="16" width="480" height="480" rx="48" fill="none" stroke="#d4c5a0" stroke-width="3" opacity="0.3"/>
  <!-- Decorative top line -->
  <line x1="80" y1="100" x2="432" y2="100" stroke="#d4c5a0" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="106" x2="432" y2="106" stroke="#d4c5a0" stroke-width="0.8" opacity="0.3"/>
  <!-- DN Monogram -->
  <text x="256" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="260" font-weight="bold" fill="#f0e6cc" letter-spacing="-15">DN</text>
  <!-- Decorative bottom line -->
  <line x1="80" y1="400" x2="432" y2="400" stroke="#d4c5a0" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="406" x2="432" y2="406" stroke="#d4c5a0" stroke-width="2" opacity="0.5"/>
  <!-- Small decorative diamond -->
